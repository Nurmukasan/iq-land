# Certbot adds HTTPS to this server after DNS points to the VPS.
server {
    listen 80;
    listen [::]:80;
    server_name iq-land.academy www.iq-land.academy;

    # The video endpoint accepts raw uploads up to 1 GiB.
    client_max_body_size 1g;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite incoming headers; do not append untrusted client values.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";

        # Stream large montages directly to Node rather than filling the disk
        # with Nginx's temporary request-body copy. Range passes through.
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
